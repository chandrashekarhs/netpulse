name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Build (Swift Package Manager)
        run: swift build -c release

      - name: Test
        run: swift test
