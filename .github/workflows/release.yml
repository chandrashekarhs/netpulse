name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── Detect which credentials are available ────────────────────────────────
      - name: Detect available credentials
        id: creds
        env:
          CERT:     ${{ secrets.DEVELOPER_ID_CERT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          [ -n "$CERT" ]     && echo "has_cert=true"     >> "$GITHUB_OUTPUT" || echo "has_cert=false"     >> "$GITHUB_OUTPUT"
          [ -n "$APPLE_ID" ] && echo "has_apple_id=true" >> "$GITHUB_OUTPUT" || echo "has_apple_id=false" >> "$GITHUB_OUTPUT"

      # ── Import Developer ID certificate (skipped when secret not set) ─────────
      - name: Import signing certificate
        if: steps.creds.outputs.has_cert == 'true'
        env:
          CERT_DATA:     ${{ secrets.DEVELOPER_ID_CERT }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          CERT="$RUNNER_TEMP/cert.p12"
          echo "$CERT_DATA" | base64 --decode -o "$CERT"
          security create-keychain -p "ci-temp" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "ci-temp" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci-temp" "$KEYCHAIN"

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build (Swift Package Manager)
        run: swift build -c release

      # ── Package + sign (Developer ID if cert present, otherwise ad-hoc) ───────
      - name: Package & sign
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_NAME }}
        run: bash Scripts/package.sh

      # ── Notarize + staple (skipped when Apple credentials not set) ────────────
      - name: Notarize DMG
        if: steps.creds.outputs.has_apple_id == 'true'
        env:
          APPLE_ID:      ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PWD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit NetPulse.dmg \
            --apple-id   "$APPLE_ID"      \
            --team-id    "$APPLE_TEAM_ID" \
            --password   "$APPLE_APP_PWD" \
            --wait

      - name: Staple notarization ticket
        if: steps.creds.outputs.has_apple_id == 'true'
        run: xcrun stapler staple NetPulse.dmg

      # ── Publish ───────────────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NetPulse.dmg
          body: |
            ## Installation
            1. Download **NetPulse.dmg** below
            2. Open it and drag **NetPulse.app** to Applications
            3. Launch from Spotlight or your Applications folder

            > Ad-hoc signed build — right-click → Open on first launch to bypass Gatekeeper.
